name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  android:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash

    env:
      ANDROID_NDK_VERSION: 27.1.12297006
      ANDROID_BUILD_TOOLS: 36.0.0
      ANDROID_API_LEVEL: 34
      ANDROID_CMDLINE_TOOLS: 12266719

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${HOME}/android-sdk"
          rm -rf "${ANDROID_SDK_ROOT}"
          export ANDROID_HOME="${ANDROID_SDK_ROOT}"
          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          curl -sSL "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS}_latest.zip" -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "${ANDROID_SDK_ROOT}/cmdline-tools"
          mv "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools" "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_SDK_ROOT}" "platform-tools" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}" || true

      - name: Accept Android SDK licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_HOME}" --licenses || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Ensure debug keystore
        run: |
          if [[ ! -f android/app/debug.keystore ]]; then
            pushd android/app >/dev/null
            "${JAVA_HOME}/bin/keytool" -genkeypair \
              -v \
              -noprompt \
              -storetype JKS \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            popd >/dev/null
          fi

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: debug.keystore
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: android
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: androiddebugkey
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: happy-android-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
